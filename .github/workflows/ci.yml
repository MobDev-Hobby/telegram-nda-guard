name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-test:
    name: build & test
    # Self-hosted раннер на collider (пул telegram-nda-guard-runner, роль
    # `runners` в MobDev-Hobby/infra, образ ubuntu-noble): с 02.10.2026 GitHub
    # не запускает аккаунту задачи на ubuntu-latest («recent account payments
    # have failed»). Go ставит setup-go; gcc для `-race` в образе есть.
    runs-on: [self-hosted, linux, X64, build]
    # Use the public Go proxy so the build is reproducible outside any
    # corporate network. Local dev machines may override GOPROXY via
    # `go env -w`, but CI must not depend on a private proxy.
    env:
      GOPROXY: https://proxy.golang.org,direct
      GOFLAGS: -mod=mod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -race -count=1 ./...

  lint:
    name: golangci-lint
    runs-on: [self-hosted, linux, X64, build]
    env:
      GOPROXY: https://proxy.golang.org,direct
      GOFLAGS: -mod=mod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m
