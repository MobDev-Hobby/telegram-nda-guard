name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-test:
    name: build & test
    runs-on: ubuntu-latest
    # Use the public Go proxy so the build is reproducible outside any
    # corporate network. Local dev machines may override GOPROXY via
    # `go env -w`, but CI must not depend on a private proxy.
    env:
      GOPROXY: https://proxy.golang.org,direct
      # readonly, not mod: CI must fail on an out-of-date go.mod/go.sum
      # instead of silently rewriting them into a state nobody committed.
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -race -count=1 ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    env:
      GOPROXY: https://proxy.golang.org,direct
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Pinned on purpose: with `latest`, any upstream release that adds
          # a check turns a green build red without a commit of ours.
          version: v2.12.2
          args: --timeout=5m

  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    env:
      GOPROXY: https://proxy.golang.org,direct
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Unpinned by design: the point of the check is the current vuln DB.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
